<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRESCITA'25 - National Level Technical Symposium | KEC CSE</title>
    <meta name="description" content="Join CRESCITA'25, the premier national level technical symposium organized by the Department of Computer Science and Engineering, Kongu Engineering College. Features competitions, workshops, and networking opportunities.">
    <meta name="keywords" content="CRESCITA, technical symposium, programming, KEC, computer science, engineering, competition, workshop">
    
    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- OpenGraph tags for social sharing -->
    <meta property="og:title" content="CRESCITA'25 - Technical Symposium">
    <meta property="og:description" content="National Level Technical Symposium by KEC CSE Department">
    <meta property="og:type" content="website">
    
    <!-- Terminal-style favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
  </head>
  <body class="bg-black text-green-400 font-mono">
    <!-- Inline loader to prevent white flash -->
    <style>
      .loader-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .loader-text {
        color: #00ff41;
        font-family: 'Share Tech Mono', monospace;
        text-shadow: 0 0 10px rgba(0, 255, 65, 0.7);
        font-size: 24px;
        letter-spacing: 0.1em;
      }
      .loader-text::after {
        content: "";
        animation: dots 1.5s infinite;
      }
      @keyframes dots {
        0%, 20% { content: "."; }
        40% { content: ".."; }
        60% { content: "..."; }
        80%, 100% { content: ""; }
      }
      .scanline {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        background: linear-gradient(to bottom, transparent, rgba(0, 255, 65, 0.2), transparent);
        opacity: 0.7;
        animation: scan 3s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
    </style>
    <div class="loader-container" id="initial-loader">
      <div class="scanline"></div>
      <div class="loader-text">SYSTEM INITIALIZING</div>
    </div>
    <script>
      // Hide loader after content is loaded
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('initial-loader').style.display = 'none';
        }, 1500);
      });

      // Performance optimization script
      const PERFORMANCE_MONITOR = {
        // List of resource-intensive animations that can be disabled
        heavyAnimations: new Set(),
        // Current performance mode (high, medium, low)
        currentMode: 'high',
        
        // Initialize performance monitoring
        init: function() {
          // Check for low-end devices or reduced motion preference
          const isLowEndDevice = navigator.hardwareConcurrency <= 4 || 
                                !window.matchMedia('(min-width: 768px)').matches;
          const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          
          if (prefersReducedMotion || isLowEndDevice) {
            this.setPerformanceMode('low');
          }
          
          // Monitor frame rate
          this.startFrameRateMonitoring();
        },
        
        // Set performance mode based on device capabilities
        setPerformanceMode: function(mode) {
          this.currentMode = mode;
          document.body.setAttribute('data-perf-mode', mode);
          
          // Apply performance optimizations
          switch(mode) {
            case 'low':
              document.documentElement.style.setProperty('--animation-speed-factor', '0.5');
              document.documentElement.style.setProperty('--effects-opacity', '0.3');
              break;
            case 'medium':
              document.documentElement.style.setProperty('--animation-speed-factor', '0.75');
              document.documentElement.style.setProperty('--effects-opacity', '0.6');
              break;
            case 'high':
            default:
              document.documentElement.style.setProperty('--animation-speed-factor', '1');
              document.documentElement.style.setProperty('--effects-opacity', '1');
              break;
          }
        },
        
        // Monitor frame rate and adjust performance if needed
        startFrameRateMonitoring: function() {
          let lastTime = performance.now();
          let frames = 0;
          let lowFPSCount = 0;
          
          const check = () => {
            frames++;
            const currentTime = performance.now();
            const elapsed = currentTime - lastTime;
            
            if (elapsed >= 1000) {
              const fps = Math.round(frames * 1000 / elapsed);
              // If FPS drops below 30 multiple times, reduce performance mode
              if (fps < 30) {
                lowFPSCount++;
                if (lowFPSCount >= 3 && this.currentMode !== 'low') {
                  const nextMode = this.currentMode === 'high' ? 'medium' : 'low';
                  this.setPerformanceMode(nextMode);
                }
              } else {
                lowFPSCount = 0;
              }
              
              frames = 0;
              lastTime = currentTime;
            }
            
            requestAnimationFrame(check);
          };
          
          requestAnimationFrame(check);
        }
      };
      
      // Initialize performance monitoring
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.addEventListener('DOMContentLoaded', () => PERFORMANCE_MONITOR.init());
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
